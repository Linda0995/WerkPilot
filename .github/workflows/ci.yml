name: WerkPilot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-db:
    name: Build, Tests, PostgreSQL, EF
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: werkpilot
          POSTGRES_PASSWORD: werkpilot_ci
          POSTGRES_DB: werkpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werkpilot -d werkpilot_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      WERKPILOT_CONNECTION_STRING: Host=localhost;Port=5432;Database=werkpilot_ci;Username=werkpilot;Password=werkpilot_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore WerkPilot.sln

      - name: Build Release
        run: dotnet build WerkPilot.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/WerkPilot.UnitTests/WerkPilot.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Create clean EF baseline
        shell: pwsh
        run: |
          ./scripts/rebaseline-migrations.ps1 -MigrationName "InitialBaseline_CI"

      - name: Verify EF model
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/WerkPilot.Infrastructure/WerkPilot.Infrastructure.csproj \
            --startup-project src/WerkPilot.Desktop/WerkPilot.Desktop.csproj \
            --context WerkPilotDbContext

      - name: Apply EF baseline to clean PostgreSQL
        run: |
          dotnet ef database update \
            --project src/WerkPilot.Infrastructure/WerkPilot.Infrastructure.csproj \
            --startup-project src/WerkPilot.Desktop/WerkPilot.Desktop.csproj \
            --context WerkPilotDbContext

      - name: Verify database tables
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          TABLE_COUNT=$(PGPASSWORD=werkpilot_ci psql -h localhost -U werkpilot -d werkpilot_ci -t -A -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "Public tables: $TABLE_COUNT"
          test "$TABLE_COUNT" -gt 0

      - name: Stage generated EF baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/ci-baseline | Out-Null
          Copy-Item src/WerkPilot.Infrastructure/Persistence/Migrations/*.cs artifacts/ci-baseline/ -Force

      - name: Upload EF baseline
        uses: actions/upload-artifact@v4
        with:
          name: werkpilot-ef-baseline
          path: artifacts/ci-baseline/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: werkpilot-test-results
          path: |
            **/TestResults/**
          if-no-files-found: ignore

  windows-publish:
    name: Windows x64 Publish
    runs-on: windows-latest
    needs: build-test-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download validated EF baseline
        uses: actions/download-artifact@v4
        with:
          name: werkpilot-ef-baseline
          path: artifacts/ci-baseline

      - name: Replace development migrations with validated baseline
        shell: pwsh
        run: |
          $migrationDir = "src/WerkPilot.Infrastructure/Persistence/Migrations"
          Remove-Item "$migrationDir/*.cs" -Force
          Copy-Item "artifacts/ci-baseline/*.cs" $migrationDir -Force


      - name: Verify release configuration
        shell: pwsh
        run: |
          $config = Get-Content "src/WerkPilot.Desktop/appsettings.json" -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.ConnectionStrings.WerkPilot)) {
            throw "Release ConnectionStrings:WerkPilot ist leer."
          }

      - name: Restore Windows Desktop
        run: dotnet restore src/WerkPilot.Desktop/WerkPilot.Desktop.csproj -r win-x64

      - name: Build Windows Desktop
        run: dotnet build src/WerkPilot.Desktop/WerkPilot.Desktop.csproj -c Release -r win-x64 --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/publish/win-x64 | Out-Null
          dotnet publish src/WerkPilot.Desktop/WerkPilot.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o artifacts/publish/win-x64

      - name: Prepare runnable Windows product
        shell: pwsh
        run: |
          Copy-Item "deploy/docker-compose.yml" "artifacts/publish/win-x64/docker-compose.yml" -Force

          @'
          @echo off
          cd /d "%~dp0"

          set WERKPILOT_ADMIN_INITIAL_PASSWORD=WerkPilot!2026Start
          set WERKPILOT_SEED_DEMO_DATA=true
          set WERKPILOT_CONNECTION_STRING=Host=localhost;Port=5432;Database=werkpilot;Username=werkpilot;Password=werkpilot_dev

          echo Starte WerkPilot-Datenbank...

          docker inspect werkpilot-postgres >nul 2>&1
          if %errorlevel%==0 (
            docker start werkpilot-postgres >nul 2>&1
          ) else (
            docker compose -f docker-compose.yml up -d
            if errorlevel 1 (
              echo.
              echo Docker konnte die WerkPilot-Datenbank nicht starten.
              echo Bitte Docker Desktop starten und diese Datei erneut doppelklicken.
              pause
              exit /b 1
            )
          )

          echo Warte auf PostgreSQL...
          set READY=0
          for /L %%i in (1,1,30) do (
            docker exec werkpilot-postgres pg_isready -U werkpilot -d werkpilot >nul 2>&1
            if not errorlevel 1 (
              set READY=1
              goto :dbready
            )
            timeout /t 2 /nobreak >nul
          )

          :dbready
          if "%READY%"=="0" (
            echo.
            echo PostgreSQL wurde nicht rechtzeitig bereit.
            pause
            exit /b 1
          )

          echo Starte WerkPilot...
          start "" "WerkPilot.Desktop.exe"
          '@ | Set-Content "artifacts/publish/win-x64/START_WERKPILOT.cmd" -Encoding ascii

          @'
          WERKPILOT STARTEN

          1. Docker Desktop starten.
          2. START_WERKPILOT.cmd doppelklicken.
          3. WerkPilot öffnet sich automatisch.

          Die lokale PostgreSQL-Datenbank wird automatisch gestartet.

          STARTDIAGNOSE
          Falls WerkPilot kein Fenster öffnet, entsteht im selben Ordner automatisch:
          WerkPilot-Startdiagnose.txt
          Diese Datei enthält den tatsächlichen Startfehler.
          '@ | Set-Content "artifacts/publish/win-x64/START_HIER.txt" -Encoding utf8

      - name: Package release
        shell: pwsh
        run: |
          $zip = "artifacts/WerkPilot-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts/publish/win-x64/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Upload Windows product
        uses: actions/upload-artifact@v4
        with:
          name: WerkPilot-Windows-x64
          path: artifacts/WerkPilot-Windows-x64.zip
          if-no-files-found: error
